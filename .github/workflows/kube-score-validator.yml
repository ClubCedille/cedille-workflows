name: kube-score validator workflow
on:
  workflow_call:

jobs:
  kube-score:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4
        id: install-kubectl

      - name: Install kube-score
        run: |
          curl -sSL https://github.com/zegl/kube-score/releases/download/v1.20.0/kube-score_1.20.0_linux_amd64 -o /usr/local/bin/kube-score
          chmod +x /usr/local/bin/kube-score

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@cf79a64fed8a943fb1073260883d08fe0dfb4e56

      - name: Build overlays for changed kustomizations
        id: build
        shell: bash
        run: |
          set -euo pipefail
          out_dir="out/kustomize"
          mkdir -p "$out_dir"

          changed_files="${{ steps.changed-files.outputs.all_changed_files }}"

          changed_root_for() {
            local path="$1"
            IFS=/ read -r top second third fourth _ <<< "$path"

            case "$path" in
              apps/clubs/*/*/*)
                printf '%s/%s/%s/%s\n' "$top" "$second" "$third" "$fourth"
                ;;
              apps/*/*|bases/*/*|system/*/*|common/*/*)
                printf '%s/%s\n' "$top" "$second"
                ;;
            esac
          }

          # Tolerate "no matches" under -euo pipefail
          to_rebuild=$(
            { printf '%s\n' "$changed_files" | tr ' ' '\n' | grep -E '^(apps|bases|system|common)/' || true; } |
            while IFS= read -r changed_file; do
              changed_root_for "$changed_file"
            done |
            sed 's:/$::' | sort -u
          )

          echo "Apps to rebuild:"
          if [ -n "${to_rebuild:-}" ]; then
            printf '  %s\n' $to_rebuild
          else
            echo "  (none)"
          fi
          echo "-----------------------------------------"

          # Discover kustomization roots present in the repo
          roots=()
          for d in apps bases system common; do
            [ -d "$d" ] && roots+=("./$d")
          done
          [ "${#roots[@]}" -eq 0 ] && {
            echo "No kustomization roots found."
            echo "built_any=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # Early exit if nothing to rebuild
          if [ -z "${to_rebuild:-}" ]; then
            echo "Nothing to rebuild."
            echo "built_any=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Build each selected kustomization
          find "${roots[@]}" \
            -type f \( -name kustomization.yaml -o -name kustomization.yml \) \
            -not -path '*/base/*' -print0 |
          while IFS= read -r -d '' kustom; do
            dir="$(dirname "$kustom")"
            rel="${dir#./}"
            should_build=false
            while IFS= read -r root_key; do
              [ -z "$root_key" ] && continue
              if [[ "$rel" == "$root_key" || "$rel" == "$root_key"/* ]]; then
                should_build=true
                break
              fi
            done <<< "$to_rebuild"

            if [ "$should_build" = true ]; then
              name="${rel//\//_}.yaml"
              echo "▶ building $name"
              if kubectl kustomize --enable-helm \
                                   --load-restrictor LoadRestrictionsNone \
                                   "$dir" > "$out_dir/$name"; then
                echo "✓ $name built"
                # Mark roots that render resources from an upstream Helm
                # chart (helmCharts: anywhere under this kustomization tree,
                # including local bases) — the club doesn't control those
                # templates, so a subset of kube-score checks is downgraded
                # to non-blocking for them. See "Validate kube-score
                # results" below and k8s-shared/README.md#politique-kube-score.
                if find "$dir" -type f \( -name kustomization.yaml -o -name kustomization.yml \) \
                     -print0 | xargs -0 grep -lq '^helmCharts:' 2>/dev/null; then
                  echo "$name" >> "$out_dir/.helm-sourced"
                fi
              else
                echo "⚠️  $rel failed to build; skipping"
                rm -f "$out_dir/$name"
              fi
            else
              echo "⏭ $rel (unchanged)"
            fi
          done

          echo "---- Resulting manifests ----"
          ls -l "$out_dir" || true
          echo "---- Helm-sourced roots (subset of checks non-blocking) ----"
          cat "$out_dir/.helm-sourced" 2>/dev/null || echo "  (none)"

          # Output flag to gate follow-up steps
          shopt -s nullglob
          files=( "$out_dir"/*.yaml )
          if [ ${#files[@]} -gt 0 ]; then
            echo "built_any=true" >> "$GITHUB_OUTPUT"
          else
            echo "built_any=false" >> "$GITHUB_OUTPUT"
          fi

      - name: kube-score check
        id: score
        if: steps.build.outputs.built_any == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( ./out/kustomize/*.yaml )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No manifests to score."
            : > /tmp/kube-score.ci
            exit 0
          fi

          # Score each manifest individually (rather than all at once) so
          # every finding line can be tagged with its source file below —
          # that's what lets the next step know which findings came from a
          # helm-sourced root and are eligible for the non-blocking tier.
          : > /tmp/kube-score.ci
          set +e
          for f in "${files[@]}"; do
            name="$(basename "$f")"
            kube-score score --output-format ci "$f" | sed "s/^/[$name] /" | tee -a /tmp/kube-score.ci
          done
          ks_status=$?
          set -e
          echo "kube-score exited with code: $ks_status"

      - name: Collect /kube-score skip directives
        id: skips
        if: steps.build.outputs.built_any == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR_NUMBER" --json body,comments --jq '
            ([.body] + [.comments[].body])
            | map(split("\n")[])
            | map(select(startswith("/kube-score skip ")))
            | unique
            | .[]
          ' > /tmp/kskip.list || true

          gh pr view "$PR_NUMBER" --json body,comments --jq '
            ([.body] + [.comments[].body])
            | map(split("\n")[])
            | map(select(startswith("/kube-score probe-skip ")))
            | unique
            | .[]
          ' > /tmp/kprobe-skip.list || true

          echo "Skip directives found:"
          cat /tmp/kskip.list || echo "(none)"
          echo "Probe skip directives found:"
          cat /tmp/kprobe-skip.list || echo "(none)"

      - name: Validate required probes
        if: steps.build.outputs.built_any == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [ -f /tmp/kube-score.ci ] || { echo "No kube-score output; nothing to validate."; exit 0; }

          probe_skips=$(sed -E 's%^/kube-score probe-skip %%; s/\r$//' /tmp/kprobe-skip.list 2>/dev/null | sort -u || true)
          probe_lines=$(
            grep -E '^\[[^]]+\] \[CRITICAL\]' /tmp/kube-score.ci |
              grep -Ei 'missing a readinessProbe|same readiness and liveness probe|readiness probe|liveness probe|startup probe|pod-probes' ||
              true
          )
          failures=0

          # Probes are always blocking, including on helm-sourced resources
          # (see "Checks à garder bloquants" in the kube-score policy) — no
          # non-blocking downgrade here, only the existing probe-skip escape.
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            key=$(sed -E 's/^\[[^]]+\] \[CRITICAL\] +([^ ]+) +([^:]+):.*/\1 \2/' <<< "$line" | tr -d '\r')
            if grep -Fxq "$key" <<< "$probe_skips"; then
              echo "⏭  $key (probe skipped)"
            else
              echo "::error::$line"
              echo "↳  Ce workload semble nécessiter des probes."
              echo "↳  Ajoutez readinessProbe/livenessProbe/startupProbe si applicable."
              echo "↳  Pour ignorer explicitement : /kube-score probe-skip $key"
              failures=1
            fi
          done <<< "$probe_lines"

          if [ "$failures" -ne 0 ]; then
            echo
            echo "❌  des probes requises sont manquantes ou mal configurées."
            exit 1
          fi

          echo "✅  Aucun finding critique lié aux probes."

      - name: Validate kube-score results
        if: steps.build.outputs.built_any == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [ -f /tmp/kube-score.ci ] || { echo "No kube-score output; nothing to validate."; exit 0; }

          # Checks that stay blocking everywhere, even on helm-sourced
          # resources: privileged containers, missing probes (handled in the
          # previous step), and floating :latest-style tags are excluded from
          # this list on purpose.
          #
          # Checks downgraded to non-blocking (warning only) when the finding
          # comes from a manifest built out of a root that uses helmCharts: —
          # the club doesn't control those templates. Kept in sync with
          # k8s-shared/README.md#politique-kube-score.
          downgradable="container-resources container-ephemeral-storage-request-and-limit container-security-context-user-group-id pod-networkpolicy container-image-tag container-image-pull-policy"

          helm_sourced_files=""
          if [ -f ./out/kustomize/.helm-sourced ]; then
            helm_sourced_files=$(cat ./out/kustomize/.helm-sourced)
          fi

          sk=$(sed -E 's%^/kube-score skip %%; s/\r$//' /tmp/kskip.list 2>/dev/null | sort -u || true)
          critical_lines=$(grep -E '^\[[^]]+\] \[CRITICAL\]' /tmp/kube-score.ci || true)
          failures=0
          warnings=0

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            src_file=$(sed -E 's/^\[([^]]+)\].*/\1/' <<< "$line")
            key=$(sed -E 's/^\[[^]]+\] \[CRITICAL\] +([^ ]+) +([^:]+):.*/\1 \2/' <<< "$line" | tr -d '\r')
            check_id=$(awk '{print $2}' <<< "$key")

            is_helm_sourced=false
            grep -Fxq "$src_file" <<< "$helm_sourced_files" && is_helm_sourced=true
            is_downgradable=false
            grep -Fqw "$check_id" <<< "$downgradable" && is_downgradable=true

            if grep -Fxq "$key" <<< "$sk"; then
              echo "⏭  $key (skipped)"
            elif [ "$is_helm_sourced" = true ] && [ "$is_downgradable" = true ]; then
              echo "::warning::$line"
              echo "↳  Ressource issue d'un helmChart upstream, check non-bloquant ($check_id)."
              warnings=$((warnings + 1))
            else
              echo "::error::$line"
              echo "↳  Pour ignorer : /kube-score skip $key"
              failures=1
            fi
          done <<< "$critical_lines"

          if [ "$warnings" -gt 0 ]; then
            echo
            echo "⚠️  $warnings finding(s) CRITICAL non-bloquant(s) (helm chart upstream) — voir les ::warning:: ci-dessus."
          fi

          if [ "$failures" -ne 0 ]; then
            echo
            echo "❌  des findings CRITICAL bloquants sont encore présents."
            exit 1
          fi

          echo "✅  Tous les findings CRITICAL bloquants sont corrigés ou explicitement skip."
