name: Tofu Plan Summary

description: >-
  Posts or updates one pull request comment summarizing all OpenTofu plan
  artifacts produced by a matrix job. Each artifact directory must contain
  `plan.json`, `plan.log` and optionally `plan.txt`.

inputs:
  plans-dir:
    description: Directory containing one downloaded artifact directory per module.
    required: true
  marker:
    description: Unique token embedded in the PR comment.
    required: false
    default: tofu-plan-summary
  expected-modules:
    description: >-
      Optional comma-separated module names. Modules without a plan artifact
      are shown as missing.
    required: false
    default: ""
  max-resources:
    description: Maximum number of resource changes shown per module.
    required: false
    default: "30"

runs:
  using: composite
  steps:
    - name: Post consolidated plan summary
      uses: actions/github-script@v7
      env:
        PLANS_DIR: ${{ inputs.plans-dir }}
        MARKER: ${{ inputs.marker }}
        EXPECTED_MODULES: ${{ inputs.expected-modules }}
        MAX_RESOURCES: ${{ inputs.max-resources }}
      with:
        script: |
          const fs = require('fs')
          const path = require('path')

          const root = path.resolve(process.env.GITHUB_WORKSPACE || process.cwd(), process.env.PLANS_DIR)
          const marker = process.env.MARKER || 'tofu-plan-summary'
          const maxResources = Number(process.env.MAX_RESOURCES || '30')
          const expectedModules = (process.env.EXPECTED_MODULES || '')
            .split(',')
            .map(s => s.trim())
            .filter(Boolean)

          const walkFiles = dir => {
            if (!fs.existsSync(dir)) return []
            const result = []
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const entryPath = path.join(dir, entry.name)
              if (entry.isDirectory()) result.push(...walkFiles(entryPath))
              else result.push(entryPath)
            }
            return result
          }

          const readText = file => file ? fs.readFileSync(file, 'utf8') : ''
          const warningLines = logText => logText
            .split(/\r?\n/)
            .filter(line => line.includes('Warning:'))
            .map(line => line.replace(/^[│\s]+/, '').trim())
            .filter(Boolean)
            .slice(0, 20)
          const tail = (text, limit = 100) => text.trim().split(/\r?\n/).slice(-limit).join('\n')
          const actionSymbol = actions => {
            if (actions.includes('create') && actions.includes('delete')) return '±'
            return actions.map(action => ({
              create: '+',
              update: '~',
              delete: '-',
              import: 'i',
            })[action] || action).join('')
          }

          let artifactDirs = []
          try {
            artifactDirs = fs.readdirSync(root, { withFileTypes: true })
              .filter(entry => entry.isDirectory())
              .map(entry => entry.name)
          } catch (error) {
            core.warning(`Unable to read ${root}: ${error.message}`)
          }

          const summaries = []
          for (const artifactName of artifactDirs) {
            const module = artifactName.replace(/^tfplan-/, '')
            const files = walkFiles(path.join(root, artifactName))
            const planJsonPath = files.find(file => file.endsWith('/plan.json'))
            const planLogPath = files.find(file => file.endsWith('/plan.log'))
            const logText = readText(planLogPath)
            const warnings = warningLines(logText)

            const summary = {
              module,
              artifact_name: artifactName,
              status: 'failure',
              add: 0,
              change: 0,
              destroy: 0,
              import: 0,
              changes: [],
              warnings,
            }

            if (planJsonPath) {
              try {
                const plan = JSON.parse(fs.readFileSync(planJsonPath, 'utf8'))
                const resourceChanges = Array.isArray(plan.resource_changes) ? plan.resource_changes : []
                summary.status = 'success'
                summary.add = resourceChanges.filter(rc => (rc.change?.actions || []).includes('create')).length
                summary.change = resourceChanges.filter(rc => (rc.change?.actions || []).includes('update')).length
                summary.destroy = resourceChanges.filter(rc => (rc.change?.actions || []).includes('delete')).length
                summary.import = resourceChanges.filter(rc => rc.change?.importing != null).length
                summary.changes = resourceChanges
                  .filter(rc => {
                    const actions = rc.change?.actions || []
                    return !actions.includes('no-op') && !actions.includes('read')
                  })
                  .map(rc => `${actionSymbol(rc.change?.actions || [])} ${rc.address}`)
              } catch (error) {
                summary.error = `Unable to parse plan.json: ${error.message}\n\n${tail(logText, 60)}`.trim()
              }
            } else {
              summary.error = logText ? tail(logText) : 'No plan log or plan.json found'
            }

            summaries.push(summary)
          }

          summaries.sort((a, b) => String(a.module || '').localeCompare(String(b.module || '')))

          const foundModules = new Set(summaries.map(summary => summary.module))
          for (const module of expectedModules) {
            if (!foundModules.has(module)) {
              summaries.push({
                module,
                artifact_name: `tfplan-${module}`,
                status: 'missing',
                add: 0,
                change: 0,
                destroy: 0,
                import: 0,
                changes: [],
                warnings: [],
              })
            }
          }

          let artifacts = []
          try {
            const response = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            })
            artifacts = response.data.artifacts
          } catch (error) {
            core.warning(`Unable to list workflow artifacts: ${error.message}`)
          }
          const artifactsByName = new Map(artifacts.map(artifact => [artifact.name, artifact]))

          const escapeCell = value => String(value ?? '').replace(/\|/g, '\\|').replace(/\r?\n/g, ' ')
          const escapeHtml = value => String(value ?? '').replace(/[&<>]/g, char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
          })[char])
          const truncate = (value, limit) => {
            const text = String(value ?? '')
            return text.length > limit ? `${text.slice(0, limit)}\n… (${text.length - limit} characters truncated)` : text
          }

          const moduleCell = summary => {
            const artifact = artifactsByName.get(summary.artifact_name)
            if (!artifact) return `\`${escapeCell(summary.module)}\``
            const url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${artifact.id}`
            return `[${escapeCell(summary.module)}](${url})`
          }

          const statusCell = summary => {
            if (summary.status === 'missing') return '❌ no plan'
            if (summary.status === 'failure') return '❌ failed'
            const total = Number(summary.add || 0) + Number(summary.change || 0) + Number(summary.destroy || 0)
            return total === 0 ? '✅ no changes' : '⚠️ changes'
          }

          const countCell = (summary, key) => summary.status === 'success' ? String(summary[key] || 0) : '—'

          const lines = [
            `<!-- ${marker} -->`,
            '## OpenTofu plan summary',
            '',
            `[View workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            '',
          ]

          if (summaries.length === 0) {
            lines.push('No plan artifacts were produced. Check the workflow logs.')
          } else {
            lines.push('| Module | Add | Change | Destroy | Import | Status |')
            lines.push('|---|---:|---:|---:|---:|---|')
            for (const summary of summaries) {
              lines.push(`| ${moduleCell(summary)} | ${countCell(summary, 'add')} | ${countCell(summary, 'change')} | ${countCell(summary, 'destroy')} | ${countCell(summary, 'import')} | ${statusCell(summary)} |`)
            }

            const details = []
            for (const summary of summaries) {
              if (summary.error) {
                details.push(`<details><summary>❌ <code>${escapeHtml(summary.module)}</code> error</summary>`)
                details.push('')
                details.push('```text')
                details.push(truncate(summary.error, 4000))
                details.push('```')
                details.push('</details>')
              }

              if (Array.isArray(summary.warnings) && summary.warnings.length > 0) {
                details.push(`<details><summary>⚠️ <code>${escapeHtml(summary.module)}</code> warnings</summary>`)
                details.push('')
                details.push('```text')
                details.push(truncate(summary.warnings.join('\n'), 4000))
                details.push('```')
                details.push('</details>')
              }

              if (Array.isArray(summary.changes) && summary.changes.length > 0) {
                const shown = summary.changes.slice(0, maxResources)
                const remaining = summary.changes.length - shown.length
                details.push(`<details><summary><code>${escapeHtml(summary.module)}</code>: ${summary.changes.length} resource change(s)</summary>`)
                details.push('')
                details.push('```diff')
                details.push(...shown)
                if (remaining > 0) details.push(`… and ${remaining} more`)
                details.push('```')
                details.push('</details>')
              }
            }

            if (details.length > 0) {
              lines.push('')
              lines.push(...details)
            }
          }

          const body = lines.join('\n')
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100,
          })
          const existing = comments.find(comment => comment.body && comment.body.includes(`<!-- ${marker} -->`))

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            })
            core.info(`Updated plan summary comment ${existing.id}`)
          } else {
            const response = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            })
            core.info(`Created plan summary comment ${response.data.id}`)
          }
