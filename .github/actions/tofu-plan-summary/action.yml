name: Tofu Plan Summary

description: >-
  Posts or updates one pull request comment summarizing all OpenTofu plans
  produced by a matrix job. Parses the downloaded plan artifacts directly:
  each module directory must contain `plan.txt`, `plan.json`, and/or `plan.log`.

inputs:
  plans-dir:
    description: Directory containing the downloaded plan artifacts.
    required: true
  marker:
    description: Unique token embedded in the PR comment.
    required: false
    default: tofu-plan-summary
  expected-modules:
    description: >-
      Optional comma-separated module names. Modules without a summary are
      shown as missing.
    required: false
    default: ""
  max-resources:
    description: Maximum number of resource changes shown per module.
    required: false
    default: "30"

runs:
  using: composite
  steps:
    - name: Post consolidated plan summary
      uses: actions/github-script@v7
      env:
        PLANS_DIR: ${{ inputs.plans-dir }}
        MARKER: ${{ inputs.marker }}
        EXPECTED_MODULES: ${{ inputs.expected-modules }}
        MAX_RESOURCES: ${{ inputs.max-resources }}
      with:
        script: |
          const fs = require('fs')
          const path = require('path')

          const root = path.resolve(process.env.GITHUB_WORKSPACE || process.cwd(), process.env.PLANS_DIR)
          const marker = process.env.MARKER || 'tofu-plan-summary'
          const maxResources = Number(process.env.MAX_RESOURCES || '30')
          const expectedModules = (process.env.EXPECTED_MODULES || '')
            .split(',')
            .map(s => s.trim())
            .filter(Boolean)

          const walk = (dir) => {
            if (!fs.existsSync(dir)) return []
            const result = []
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const entryPath = path.join(dir, entry.name)
              if (entry.isDirectory()) result.push(...walk(entryPath))
              else result.push(entryPath)
            }
            return result
          }

          const readIfExists = (file) => {
            try {
              return fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : ''
            } catch (error) {
              core.warning(`Unable to read ${file}: ${error.message}`)
              return ''
            }
          }

          const moduleName = (dir) => {
            const base = path.basename(dir)
            return base.startsWith('tfplan-') ? base.slice('tfplan-'.length) : base
          }

          const parsePlanJson = (jsonText) => {
            if (!jsonText) return null
            try {
              const plan = JSON.parse(jsonText)
              const resourceChanges = Array.isArray(plan.resource_changes) ? plan.resource_changes : []
              const changes = []
              let add = 0
              let change = 0
              let destroy = 0
              for (const rc of resourceChanges) {
                const actions = rc.change && Array.isArray(rc.change.actions) ? rc.change.actions : []
                if (actions.includes('no-op') || actions.includes('read')) continue
                if (actions.includes('create') && actions.includes('delete')) {
                  change += 1
                  changes.push(`  # ${rc.address} will be replaced`)
                } else if (actions.includes('create')) {
                  add += 1
                  changes.push(`  # ${rc.address} will be created`)
                } else if (actions.includes('update')) {
                  change += 1
                  changes.push(`  # ${rc.address} will be updated`)
                } else if (actions.includes('delete')) {
                  destroy += 1
                  changes.push(`  # ${rc.address} will be destroyed`)
                }
              }
              return { add, change, destroy, changes }
            } catch (error) {
              core.warning(`Unable to parse plan JSON: ${error.message}`)
              return null
            }
          }

          const parseSummary = (dir) => {
            const planText = readIfExists(path.join(dir, 'plan.txt'))
            const logText = readIfExists(path.join(dir, 'plan.log'))
            const planJson = readIfExists(path.join(dir, 'plan.json'))
            const module = moduleName(dir)
            const summary = {
              module,
              status: 'failure',
              add: 0,
              change: 0,
              destroy: 0,
              import: 0,
              changes: [],
              warnings: [],
              error: '',
              artifact_name: `tfplan-${module}`,
            }

            const planMatch = planText.match(/Plan:\s*(?:(\d+) to import,\s*)?(\d+) to add,\s*(\d+) to change,\s*(\d+) to destroy\./)
            if (planMatch) {
              summary.status = 'success'
              summary.import = Number(planMatch[1] || 0)
              summary.add = Number(planMatch[2] || 0)
              summary.change = Number(planMatch[3] || 0)
              summary.destroy = Number(planMatch[4] || 0)
            } else if (/No changes\./i.test(planText)) {
              summary.status = 'success'
            } else {
              const fromJson = parsePlanJson(planJson)
              if (fromJson) {
                summary.status = 'success'
                summary.add = fromJson.add
                summary.change = fromJson.change
                summary.destroy = fromJson.destroy
                summary.changes = fromJson.changes
              } else {
                summary.error = (logText || planText || 'No plan output found').trim().slice(-4000)
              }
            }

            if (summary.status === 'success' && summary.changes.length === 0) {
              let inResource = false
              for (const line of planText.split(/\r?\n/)) {
                if (/^  # /.test(line)) {
                  inResource = true
                  summary.changes.push(line)
                } else if (inResource && /^  [+~-] /.test(line)) {
                  summary.changes.push(line)
                } else {
                  inResource = false
                }
              }
              if (summary.changes.length > 200) {
                summary.changes = summary.changes.slice(0, 200)
                summary.changes.push('… changes truncated')
              }
            }

            const warnings = new Set()
            for (const source of [logText, planText]) {
              for (const line of source.split(/\r?\n/)) {
                if (/^Warning:/.test(line)) warnings.add(line)
              }
            }
            summary.warnings = [...warnings]
            return summary
          }

          const planFiles = walk(root).filter(file => ['plan.txt', 'plan.json', 'plan.log'].includes(path.basename(file)))
          const planDirs = [...new Set(planFiles.map(file => path.dirname(file)))]
          const summaries = planDirs.map(parseSummary)

          summaries.sort((a, b) => String(a.module || '').localeCompare(String(b.module || '')))

          const foundModules = new Set(summaries.map(s => s.module))
          for (const module of expectedModules) {
            if (!foundModules.has(module)) {
              summaries.push({
                module,
                status: 'missing',
                add: 0,
                change: 0,
                destroy: 0,
                import: 0,
                changes: [],
                warnings: [],
              })
            }
          }

          let artifacts = []
          try {
            const response = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            })
            artifacts = response.data.artifacts
          } catch (error) {
            core.warning(`Unable to list workflow artifacts: ${error.message}`)
          }
          const artifactsByName = new Map(artifacts.map(artifact => [artifact.name, artifact]))

          const escapeCell = value => String(value ?? '').replace(/\|/g, '\\|').replace(/\r?\n/g, ' ')
          const escapeHtml = value => String(value ?? '').replace(/[&<>]/g, char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
          })[char])
          const truncate = (value, limit) => {
            const text = String(value ?? '')
            return text.length > limit ? `${text.slice(0, limit)}\n… (${text.length - limit} characters truncated)` : text
          }

          const moduleCell = summary => {
            const artifactName = summary.artifact_name || `tfplan-${summary.module}`
            const artifact = artifactsByName.get(artifactName)
            if (!artifact) return `\`${escapeCell(summary.module)}\``
            const url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${artifact.id}`
            return `[${escapeCell(summary.module)}](${url})`
          }

          const statusCell = summary => {
            if (summary.status === 'missing') return '❌ no plan'
            if (summary.status === 'failure') return '❌ failed'
            const total = Number(summary.add || 0) + Number(summary.change || 0) + Number(summary.destroy || 0)
            return total === 0 ? '✅ no changes' : '⚠️ changes'
          }

          const countCell = (summary, key) => summary.status === 'success' ? String(summary[key] || 0) : '—'

          const lines = [
            `<!-- ${marker} -->`,
            '## OpenTofu plan summary',
            '',
            `[View workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            '',
          ]

          if (summaries.length === 0) {
            lines.push('No plan summaries were produced. Check the workflow logs.')
          } else {
            lines.push('| Module | Add | Change | Destroy | Import | Status |')
            lines.push('|---|---:|---:|---:|---:|---|')
            for (const summary of summaries) {
              lines.push(`| ${moduleCell(summary)} | ${countCell(summary, 'add')} | ${countCell(summary, 'change')} | ${countCell(summary, 'destroy')} | ${countCell(summary, 'import')} | ${statusCell(summary)} |`)
            }

            const details = []
            for (const summary of summaries) {
              if (summary.error) {
                details.push(`<details><summary>❌ <code>${escapeHtml(summary.module)}</code> error</summary>`)
                details.push('')
                details.push('```text')
                details.push(truncate(summary.error, 4000))
                details.push('```')
                details.push('</details>')
              }

              if (Array.isArray(summary.warnings) && summary.warnings.length > 0) {
                details.push(`<details><summary>⚠️ <code>${escapeHtml(summary.module)}</code> warnings</summary>`)
                details.push('')
                details.push('```text')
                details.push(truncate(summary.warnings.join('\n'), 4000))
                details.push('```')
                details.push('</details>')
              }

              if (Array.isArray(summary.changes) && summary.changes.length > 0) {
                const shown = summary.changes.slice(0, maxResources)
                const remaining = summary.changes.length - shown.length
                const resourceCount = summary.changes.filter(line => /^  # /.test(line)).length
                details.push(`<details><summary><code>${escapeHtml(summary.module)}</code>: ${resourceCount} resource change(s)</summary>`)
                details.push('')
                details.push('```diff')
                details.push(...shown)
                if (remaining > 0) details.push(`… and ${remaining} more`)
                details.push('```')
                details.push('</details>')
              }
            }

            if (details.length > 0) {
              lines.push('')
              lines.push(...details)
            }
          }

          const body = lines.join('\n')
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100,
          })
          const existing = comments.find(comment => comment.body && comment.body.includes(`<!-- ${marker} -->`))

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            })
            core.info(`Updated plan summary comment ${existing.id}`)
          } else {
            const response = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            })
            core.info(`Created plan summary comment ${response.data.id}`)
          }
